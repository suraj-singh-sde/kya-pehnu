# The stack's front door: the built app, and the only way to the backend. It overwrites X-Forwarded-For with the
# address it saw, so the backend's sign-in rate limit cannot be bypassed with a forged header (ADR 0018).
pid /tmp/nginx.pid;
# Request lines and URLs can carry a person's text (place names, redirect parameters): no access log, and only
# critical errors. A rare `crit` line may still carry a request line (README, Limits).
error_log /dev/stderr crit;

events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log off;
    server_tokens off;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # Docker's resolver, asked again every 10 s: nginx starts and recovers while the backend is down or recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 3s; # a stopped backend answers 502 at once instead of after the default 30 s

    # Same limit as the application (MAX_BODY_BYTES); uploads stream through without being buffered on disk.
    client_max_body_size 5001m;
    client_body_timeout 60s;
    proxy_request_buffering off;

    server {
        listen 8080;
        root /usr/share/nginx/html;
        set $backend http://backend:8000;

        # Hosting behind a proxy on the compose network mounts a real-IP snippet here (a real-IP snippet);
        # the directory does not exist in the plain stack, and a glob that matches nothing is fine.
        include /etc/nginx/realip/*.conf;

        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy same-origin;
        add_header X-Frame-Options DENY;

        # A chat turn can run as long as its lock (TURN_LOCK_TTL_S, 1260 s).
        location /api/chat/ {
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 1560s;
            proxy_send_timeout 1560s;
        }

        location /api/ {
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location /images/ {
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # The frontend is unhealthy while the backend or Valkey is down.
        location = /readyz {
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host; # the backend refuses a Host that is not its public name
        }

        location = /livez {
            return 200 "ok\n";
        }

        location /assets/ {
            expires 1y;
        }

        # /docs and /openapi.json are not proxied: they fall through to the app shell.
        # The shell is revalidated on every load (ETag): a cached index.html would name asset hashes an upgrade removed.
        # An add_header here stops the server-level ones from applying, so they are repeated.
        location / {
            add_header Cache-Control "no-cache";
            add_header X-Content-Type-Options nosniff;
            add_header Referrer-Policy same-origin;
            add_header X-Frame-Options DENY;
            try_files $uri /index.html;
        }
    }
}
